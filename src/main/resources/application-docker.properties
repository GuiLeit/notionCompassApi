# Server
server.port=${SERVER_PORT:8080}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql = true

# Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.org.flywaydb=DEBUG

# Notion API Configuration
notion.api.key=${NOTION_API_KEY}
notion.client.id=${NOTION_CLIENT_ID}
notion.client.secret=${NOTION_CLIENT_SECRET}
notion.redirect.uri=${NOTION_REDIRECT_URI}
notion.webhook.secret=${NOTION_WEBHOOK_SECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.hours=${JWT_EXPIRATION_HOURS:24}

app.extension.id=${APP_EXTENSION_ID}